[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "aacp-conformance"
version = "0.3.0a1"
description = "Bounded, score-free authority conformance and interoperability workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["jsonschema==4.23.0", "PyYAML==6.0.3"]

[project.scripts]
aacp = "aacp.cli:main"

[project.urls]
Repository = "https://github.com/darklordVirtual/agent-authority-conformance"

[tool.setuptools]
packages = ["aacp", "aacp.schemas"]

[tool.setuptools.package-dir]
"aacp.schemas" = "schema"

[tool.setuptools.package-data]
"aacp.schemas" = ["*.json"]