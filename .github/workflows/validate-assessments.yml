name: Validate assessments

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.33.2

      - name: Validate assessment examples
        run: check-jsonschema --schemafile schema/assessment.schema.json examples/*.json

      - name: Validate federation adapter manifests
        run: check-jsonschema --schemafile schema/federation-adapter-v1.schema.json adapters/*/adapter.json

      - name: Validate federation run example
        run: check-jsonschema --schemafile schema/federation-run-v1.schema.json interop/examples/federation-run-v1.json

      - name: Validate federation edge example
        run: check-jsonschema --schemafile schema/federation-edge-record-v1.schema.json interop/examples/federation-edge-record-v1.json

  evidence-v02:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate assessments and committed fixtures
        run: python -m conformance.check

      - name: Score the fixtures against the seeded faults
        run: python -m conformance.mutations

      - name: Verify the frozen reference vectors without AACP code
        working-directory: vectors/aacp-reference-vectors-v1
        run: sha256sum --check SHA256SUMS

      - name: Rebuild the reference vectors from their sources and check the reference
        run: |
          python -m conformance.vectors verify
          python scripts/build_reference_vectors.py --check
          python -m conformance.vectors check

      - name: Run the reference and the stdlib example over the stdio protocol
        run: |
          python -m conformance.vectors run --impl "python -m conformance.vectors serve"
          python -m conformance.vectors run --impl "python templates/vector-impl/stdlib_impl.py"

      - name: Check the E rule's invariants over the generated space
        run: python -m conformance.invariants

      - name: Run semantic and harness regression tests
        run: python -m unittest discover -s tests -v

      - name: Fetch pinned corpus-adequacy for lab engine integration tests
        run: |
          git clone --quiet https://github.com/corpus-adequacy/corpus-adequacy.git "$RUNNER_TEMP/corpus-adequacy"
          git -C "$RUNNER_TEMP/corpus-adequacy" checkout --quiet 5fa2ff587497b00ac684a767335b9068f7e520a6

      - name: Run lab tests including the corpus-adequacy engine
        run: AAC_CORPUS_ADEQUACY="$RUNNER_TEMP/corpus-adequacy" python -m unittest discover -s tests/lab -t . -v

      - name: Ensure checks did not rewrite tracked evidence
        run: git diff --exit-code

  tests-macos:
    # The lab tests compare paths under a temporary directory, which macOS
    # reaches through a symlink. Ubuntu alone did not catch a comparison of an
    # unresolved path with a resolved one.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run semantic and harness regression tests
        run: python -m unittest discover -s tests

      - name: Run lab tests without the corpus-adequacy engine
        run: python -m unittest discover -s tests/lab -t .

  cli-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"

      - name: Install wheel into a clean environment and exercise the CLI outside the checkout
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          python scripts/smoke_installed_cli.py "$RUNNER_TEMP"/wheels/aacp_conformance-*.whl --version "$VERSION"

      - name: Test release tooling
        run: python -m unittest tests.test_release -v

  remora-adapter-metatest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AACP
        uses: actions/checkout@v4
        with:
          path: aac
          persist-credentials: false

      - name: Check out pinned REMORA subject
        uses: actions/checkout@v4
        with:
          repository: darklordVirtual/REMORA-research
          ref: 31c4060630923344d43d9fac26821150262c3687
          path: remora
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned REMORA evidence without executing producer code
        working-directory: aac
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m scripts.run_federation_adapter \
            --manifest adapters/remora-evidence-sufficiency-v1/adapter.json \
            --subject-root ../remora \
            --record-dir "$RUNNER_TEMP/remora-resolution" \
            --runner "$GITHUB_ACTOR" \
            --fixture-author REMORA-research \
            --classification AUTHOR_RUN \
            --summary "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          import os
          p=os.path.join(os.environ["RUNNER_TEMP"], "remora-resolution", "bundle.json")
          x=json.load(open(p, encoding="utf-8"))
          assert x["adapter_status"] == "RESOLVED"
          assert x["review_state"] == "PENDING_REVIEW_WINDOW"
          assert x["publication_authorized"] is False
          assert all(c["property_verdict"] is None for c in x["claims"])
          assert all(e["resolution"] == "RESOLVED" for e in x["evidence"])
          PY

  nti-real-bytes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AACP
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rerun the NTI witness scope over the real pinned bytes and compare with the record
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          AACP_NETWORK_TESTS=1 python -m unittest tests.lab.test_nti_recorded -v
