name: Validate assessments

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --disable-pip-version-check check-jsonschema==0.33.2

      - name: Validate assessment examples
        run: check-jsonschema --schemafile schema/assessment.schema.json examples/*.json

      - name: Validate federation adapter manifests
        run: check-jsonschema --schemafile schema/federation-adapter-v1.schema.json adapters/*/adapter.json

      - name: Validate federation run example
        run: check-jsonschema --schemafile schema/federation-run-v1.schema.json interop/examples/federation-run-v1.json

      - name: Validate federation edge example
        run: check-jsonschema --schemafile schema/federation-edge-record-v1.schema.json interop/examples/federation-edge-record-v1.json

  evidence-v02:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate assessments and committed fixtures
        run: python -m conformance.check

      - name: Score the fixtures against the seeded faults
        run: python -m conformance.mutations

      - name: Check the E rule's invariants over the generated space
        run: python -m conformance.invariants

      - name: Run semantic and harness regression tests
        run: python -m unittest discover -s tests -v

      - name: Ensure checks did not rewrite tracked evidence
        run: git diff --exit-code

  remora-adapter-metatest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AACP
        uses: actions/checkout@v4
        with:
          path: aac
          persist-credentials: false

      - name: Check out pinned REMORA subject
        uses: actions/checkout@v4
        with:
          repository: darklordVirtual/REMORA-research
          ref: 31c4060630923344d43d9fac26821150262c3687
          path: remora
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned REMORA evidence without executing producer code
        working-directory: aac
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m scripts.run_federation_adapter \
            --manifest adapters/remora-evidence-sufficiency-v1/adapter.json \
            --subject-root ../remora \
            --record-dir "$RUNNER_TEMP/remora-resolution" \
            --runner "$GITHUB_ACTOR" \
            --fixture-author REMORA-research \
            --classification AUTHOR_RUN \
            --summary "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          import os
          p=os.path.join(os.environ["RUNNER_TEMP"], "remora-resolution", "bundle.json")
          x=json.load(open(p, encoding="utf-8"))
          assert x["adapter_status"] == "RESOLVED"
          assert x["review_state"] == "PENDING_REVIEW_WINDOW"
          assert x["publication_authorized"] is False
          assert all(c["property_verdict"] is None for c in x["claims"])
          assert all(e["resolution"] == "RESOLVED" for e in x["evidence"])
          PY
